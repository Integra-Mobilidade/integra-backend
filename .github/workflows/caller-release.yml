name: Caller CI/CD Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Selecione o fluxo desejado:"
        required: true
        default: "Build & Deploy HOM"
        type: choice
        options:
          - "Build Only"
          - "Build & Deploy HOM"
          - "Build & Deploy PROD"
      enable_sonar:
        description: "Habilitar análise do SonarQube?"
        required: false
        type: boolean
        default: true

jobs:
  # ---------------------------------------------------
  # 0. GATEKEEPER (Validação de Branch)
  # ---------------------------------------------------
  validate-branch:
    name: Check Branch Validity
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release/Main Branch
        run: |
          if [[ "${{ github.ref }}" != refs/heads/release/* && "${{ github.ref }}" != refs/heads/main ]]; then
            echo "❌ ERRO: O fluxo de Release NÃO PODE ser acionado a partir desta branch." >> $GITHUB_STEP_SUMMARY
            echo "Use apenas a branch 'main' ou branches do tipo 'release/*'." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Branch validada com sucesso."

  # ---------------------------------------------------
  # 1. BUILD
  # ---------------------------------------------------
  build:
    name: Build Application
    needs: validate-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Build NestJS
        run: npm run build

  # ---------------------------------------------------
  # 2A. TESTS
  # ---------------------------------------------------
  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci

      - name: Unit Tests & Coverage
        run: npm run test:cov | tee coverage_output.txt

      - name: Test Job Summary
        if: always()
        run: |
          echo "### 📊 Resumo de Cobertura de Testes" >> $GITHUB_STEP_SUMMARY
          TOTAL_LINE=$(cat coverage_output.txt | grep "All files" | sed 's/|//g' | tr -s " " || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            echo "| Métrica | Cobertura |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| **Statements** | $(echo "$TOTAL_LINE" | awk '{print $3}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branches** | $(echo "$TOTAL_LINE" | awk '{print $4}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Functions** | $(echo "$TOTAL_LINE" | awk '{print $5}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Lines** | $(echo "$TOTAL_LINE" | awk '{print $6}')% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Não foi possível extrair as métricas." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  # ---------------------------------------------------
  # 2B. SONARQUBE
  # ---------------------------------------------------
  sonar:
    name: SonarQube Scan
    needs: build
    if: inputs.enable_sonar == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan Execution
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Sonar Job Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ SonarQube Scan Aprovado!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ SonarQube Scan Reprovado!" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------
  # 3. DEPLOY DEV (Obrigatório antes de HOM)
  # ---------------------------------------------------
  deploy-dev:
    name: Deploy to DEV
    needs: [test, sonar]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (github.event_name == 'push' || inputs.action == 'Build & Deploy HOM' || inputs.action == 'Build & Deploy PROD')
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: 🚀 Acionar Render API (DEV)
        id: trigger-deploy-dev
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Acionando a API do Render para o ambiente DEV..."
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Erro ao acionar deploy. Resposta: $RESPONSE"
            exit 1
          fi

          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "✅ Deploy acionado com sucesso (ID: $DEPLOY_ID)."

      - name: ⏳ Aguardar Servidor Online (DEV)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            echo "🔄 [$(date +'%H:%M:%S')] O Render está trabalhando... Status atual em DEV: $STATUS"
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
          done

          if [ "$STATUS" == "live" ]; then
            echo "🎉 [$(date +'%H:%M:%S')] Deploy DEV concluído com sucesso!"
            exit 0
          else
            echo "❌ [$(date +'%H:%M:%S')] Falha no Render DEV. Status: $STATUS"
            exit 1
          fi

      - name: 📝 Deploy DEV Summary
        if: success()
        run: echo "### 🚀 Eventer-API atualizado no ambiente DEV!" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------
  # 4. DEPLOY HOM
  # ---------------------------------------------------
  deploy-hom:
    name: Deploy to HOM
    needs: deploy-dev
    if: |
      always() &&
      needs.deploy-dev.result == 'success' &&
      (github.event_name == 'push' || inputs.action == 'Build & Deploy HOM' || inputs.action == 'Build & Deploy PROD')
    runs-on: ubuntu-latest
    environment: HOM # AQUI O GITHUB PAUSA E EXIGE A APROVAÇÃO (Required Reviewers)
    steps:
      - name: 🚀 Acionar Render API (HOM)
        id: trigger-deploy-hom
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "✅ Aprovação recebida! Acionando a API do Render para HOM..."
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Erro ao acionar deploy. Resposta: $RESPONSE"
            exit 1
          fi

          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "✅ Deploy acionado com sucesso (ID: $DEPLOY_ID)."

      - name: ⏳ Aguardar Servidor Online (HOM)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            echo "🔄 [$(date +'%H:%M:%S')] O Render está trabalhando... Status atual em HOM: $STATUS"
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
          done

          if [ "$STATUS" == "live" ]; then
            echo "🎉 [$(date +'%H:%M:%S')] Deploy HOM concluído com sucesso!"
            exit 0
          else
            echo "❌ [$(date +'%H:%M:%S')] Falha no Render HOM. Status: $STATUS"
            exit 1
          fi

      - name: 📝 Deploy HOM Summary
        if: success()
        run: echo "### 🔒 O projeto Eventer-API foi atualizado no ambiente de Homologação (HOM)!" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------
  # 5. DEPLOY PROD
  # ---------------------------------------------------
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-hom
    if: |
      always() && 
      needs.deploy-hom.result == 'success' && 
      (github.ref == 'refs/heads/main' || inputs.action == 'Build & Deploy PROD')
    runs-on: ubuntu-latest
    environment: PROD # AQUI O GITHUB PAUSA NOVAMENTE E EXIGE A APROVAÇÃO FINAL
    steps:
      - name: 🚀 Acionar Render API (PROD)
        id: trigger-deploy-prod
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀 Aprovação FINAL recebida! Acionando a API do Render para PROD..."
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Erro ao acionar deploy em Produção. Resposta: $RESPONSE"
            exit 1
          fi

          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "✅ Deploy acionado com sucesso (ID: $DEPLOY_ID)."

      - name: ⏳ Aguardar Servidor Online (PROD)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            echo "🔄 [$(date +'%H:%M:%S')] O Render está trabalhando... Status atual em PROD: $STATUS"
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
          done

          if [ "$STATUS" == "live" ]; then
            echo "🎉 [$(date +'%H:%M:%S')] Deploy PROD concluído com sucesso!"
            exit 0
          else
            echo "❌ [$(date +'%H:%M:%S')] Falha no Render PROD. Status: $STATUS"
            exit 1
          fi

      - name: 📝 Deploy PROD Summary
        if: success()
        run: echo "### 🌎 O projeto Eventer-API está online em PRODUÇÃO!" >> $GITHUB_STEP_SUMMARY
