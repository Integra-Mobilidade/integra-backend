name: Caller CI/CD Sandbox

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: "O que deseja fazer?"
        required: true
        default: "Build & Deploy"
        type: choice
        options:
          - "Build Only"
          - "Build & Deploy"
      enable_sonar:
        description: "Habilitar análise do SonarQube?"
        required: false
        type: boolean
        default: true

jobs:
  # ---------------------------------------------------
  # 1. BUILD
  # ---------------------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Linter
        run: npm run lint
      - name: Build NestJS
        run: npm run build

  # ---------------------------------------------------
  # 2A. TESTS (Em paralelo ao Sonar)
  # ---------------------------------------------------
  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci

      - name: Unit Tests & Coverage
        run: npm run test:cov | tee coverage_output.txt

      - name: Test Job Summary
        if: always()
        run: |
          echo "### 📊 Resumo de Cobertura de Testes" >> $GITHUB_STEP_SUMMARY
          TOTAL_LINE=$(cat coverage_output.txt | grep "All files" | sed 's/|//g' | tr -s " " || echo "")
          if [ -n "$TOTAL_LINE" ]; then
            echo "| Métrica | Cobertura |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| **Statements** | $(echo "$TOTAL_LINE" | awk '{print $3}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branches** | $(echo "$TOTAL_LINE" | awk '{print $4}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Functions** | $(echo "$TOTAL_LINE" | awk '{print $5}')% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Lines** | $(echo "$TOTAL_LINE" | awk '{print $6}')% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Não foi possível extrair as métricas de cobertura." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  # ---------------------------------------------------
  # 2B. SONARQUBE (Em paralelo aos testes)
  # ---------------------------------------------------
  sonar:
    name: SonarQube Scan
    needs: build
    if: inputs.enable_sonar == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan Execution
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Nota: Como roda em paralelo, o Sonar não vai ler o lcov.info gerado no step 'test' simultaneamente.
          # Ele fará apenas a validação de Code Smells e vulnerabilidades estáticas.
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}

      - name: Sonar Job Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ SonarQube Scan Aprovado!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ SonarQube Scan Reprovado!" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------
  # 3. DEPLOY DEV
  # ---------------------------------------------------
  deploy-dev:
    name: Deploy to DEV
    needs: [test, sonar]
    # Trava rigorosa: Só segue se o TEST passar e o SONAR passar (ou for pulado pelo input)
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (github.event_name == 'push' || inputs.action == 'Build & Deploy')
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Start and Wait for Render
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Acionando a API do Render..."
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Erro ao acionar deploy."
            exit 1
          fi

          STATUS="created"
          # Loop com identificação visual de progresso pulsante no console
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            echo "🔄 [$(date +'%H:%M:%S')] O Render está trabalhando... Status atual: $STATUS"
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
          done

          if [ "$STATUS" == "live" ]; then
            echo "🎉 [$(date +'%H:%M:%S')] Deploy concluído com sucesso!"
            exit 0
          else
            echo "❌ [$(date +'%H:%M:%S')] Falha no Render. Status: $STATUS"
            exit 1
          fi

      - name: Deploy DEV Summary
        if: success()
        run: echo "### 🚀 Eventer-API atualizado com sucesso no ambiente DEV!" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------
  # 4. DEPLOY HOM (Automático após DEV se for release)
  # ---------------------------------------------------
  deploy-hom:
    name: Deploy to HOM
    needs: deploy-dev
    # Aciona automaticamente APENAS se a branch for release/*
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: HOM # A trava "Required reviewers" pausa a esteira aqui!
    steps:
      - name: Start and Wait for Render (HOM)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_HOM }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "✅ Aprovação recebida! Iniciando deploy em Homologação..."

          # Repetição do bloco de deploy apontando para o Service ID de HOM
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            exit 1
          fi

          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            echo "🔄 [$(date +'%H:%M:%S')] Status atual em HOM: $STATUS"
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
          done

          if [ "$STATUS" != "live" ]; then
            exit 1
          fi

      - name: Deploy HOM Summary
        if: success()
        run: echo "### 🔒 Eventer-API atualizado com sucesso no ambiente HOM!" >> $GITHUB_STEP_SUMMARY
