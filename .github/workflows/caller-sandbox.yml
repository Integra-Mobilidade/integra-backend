name: CI/CD Sandbox (DEV)

on:
  push:
    branches: ["develop"] # Deploy automático quando a develop recebe código
  workflow_dispatch:
    inputs:
      action:
        description: "O que deseja fazer?"
        required: true
        default: "Build & Deploy"
        type: choice
        options:
          - "Build Only"
          - "Build & Deploy"
      enable_sonar:
        description: "Habilitar análise do SonarQube?"
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Unit Tests & Coverage
        run: npm run test:cov | tee coverage_output.txt

      - name: SonarQube Scan
        if: ${{ inputs.enable_sonar == true }}
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy-dev:
    name: Deploy to DEV
    needs: build-and-test
    # Executa se for push na develop OU se a ação selecionada manualmente for de Deploy
    if: github.event_name == 'push' || inputs.action == 'Build & Deploy'
    runs-on: ubuntu-latest

    # Mapeia para o environment no GitHub
    environment:
      name: DEV
      # url: https://sua-api-dev.onrender.com (opcional, cria um botão de acesso no log do GH Actions)

    steps:
      - name: Start and wait for Deploy (Render)
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Acionando a API do Render para o serviço ${{ secrets.RENDER_SERVICE_ID }}..."

          # O 'Bearer ' antes da variável é obrigatório para a API do Render aceitar
          RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")

          # Imprime a resposta para facilitar o debug caso a API recuse a chamada
          echo "Resposta bruta do Render: $RESPONSE"
            
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id')

          # Se o ID vier como null ou erro (porque a resposta não era o JSON esperado)
          if [ "$DEPLOY_ID" == "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Erro ao acionar deploy. Verifique o log 'Resposta bruta' acima para entender o motivo."
            exit 1
          fi

          echo "✅ Deploy acionado (ID: $DEPLOY_ID). Aguardando finalização do servidor do Render..."

          STATUS="created"
          while [ "$STATUS" == "created" ] || [ "$STATUS" == "build_in_progress" ] || [ "$STATUS" == "update_in_progress" ]; do
            sleep 15
            STATUS_RESPONSE=$(curl -s -X GET "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            STATUS=$(echo $STATUS_RESPONSE | jq -r '.status')
            echo "Status atual no Render: $STATUS"
          done

          if [ "$STATUS" == "live" ]; then
            echo "🎉 Deploy online com sucesso!"
            exit 0
          else
            echo "❌ O deploy falhou no Render com o status: $STATUS"
            exit 1
          fi
      - name: Deploy Summary
        if: success()
        run: |
          echo "### ✅ Deploy DEV Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "A aplicação subiu em desenvolvimento (Sandbox)." >> $GITHUB_STEP_SUMMARY
